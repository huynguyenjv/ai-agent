name: CI

on:
  push:
    branches: [master, "feature/**"]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install deps
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
      - name: Lint (ruff)
        run: pip install ruff && ruff check . || true   # advisory for now
      - name: Unit + integration tests
        env:
          DEV_MODE: "true"
        run: python -m pytest -q

  eval-gate:
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install deps
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
      # Produce benchmark results against a staging model, then gate.
      # (Wire your benchmark run here; falls back to skip when no baseline.)
      - name: Eval gate
        run: |
          if [ -f eval/baseline.json ] && [ -f eval/results.json ]; then
            python -m eval.ci_gate --results eval/results.json --baseline eval/baseline.json
          else
            echo "No baseline/results — eval gate skipped."
          fi

  image:
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4
      - name: Build image
        run: docker build -t ai-agent:ci .
      - name: Trivy scan
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: ai-agent:ci
          severity: CRITICAL,HIGH
          exit-code: "0"   # advisory; set to 1 to block on vulns
