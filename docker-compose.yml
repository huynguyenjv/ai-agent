# =============================================================================
# AI Coding Agent — production docker-compose
# =============================================================================
# vLLM chạy ở container/image riêng (không trong compose này).
# Trong `.env`, set VLLM_BASE_URL:
#   - vLLM trên cùng host (bare-metal):   http://host.docker.internal:8000/v1
#   - vLLM ở docker network khác:         http://<vllm-container>:8000/v1
#     (cần join network: thêm `networks: [vllm_net]` + external block bên dưới)
#
# First run (HF cache chưa có):
#   HF_HUB_OFFLINE=0 docker compose up -d
#   # chờ embedder tải all-MiniLM-L6-v2 xong (1 lần), rồi set HF_HUB_OFFLINE=1
# =============================================================================

services:

  ai-agent:
    build: .
    container_name: ai-agent
    restart: unless-stopped
    env_file: .env
    environment:
      DATABASE_URL: postgresql://postgres:postgres@postgres:5432/metrics_db
      # For multi-instance: uncomment and start redis with: docker compose --profile scale up
      # REDIS_URL: redis://redis:6379/0
    ports:
      - "${PORT:-8080}:${PORT:-8080}"
    extra_hosts:
      # Cho phép container gọi vLLM chạy trên host (Linux docker 20.10+)
      - "host.docker.internal:host-gateway"
    depends_on:
      # qdrant only needed when RAG is enabled (start it with: --profile rag)
      postgres:
        condition: service_healthy
    volumes:
      - hf_cache:/home/agent/.cache/huggingface
      # Mount CA bundle cho GitLab self-signed (nếu có). Set GITLAB_CA_BUNDLE=/certs/ca.crt trong .env
      - ./deploy/certs:/certs:ro
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "5"
    deploy:
      resources:
        limits:
          memory: 2G
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:${PORT:-8080}/health || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s

  qdrant:
    image: qdrant/qdrant:latest
    container_name: ai-agent-qdrant
    restart: unless-stopped
    # RAG is opt-in — qdrant only starts with: docker compose --profile rag up
    profiles: ["rag"]
    ports:
      # Bind localhost only — ai-agent truy cập qua docker network service name
      - "127.0.0.1:6333:6333"
    volumes:
      - qdrant_data:/qdrant/storage
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    healthcheck:
      # Qdrant image không có curl — dùng bash /dev/tcp để TCP probe
      test: ["CMD-SHELL", "bash -c '</dev/tcp/localhost/6333' || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 10s

  redis:
    image: redis:7-alpine
    container_name: ai-agent-redis
    restart: unless-stopped
    # Shared session + rate-limit for multi-instance. Start with: --profile scale
    profiles: ["scale"]
    ports:
      - "127.0.0.1:6379:6379"
    command: ["redis-server", "--save", "", "--appendonly", "no"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 15s
      timeout: 5s
      retries: 5

  postgres:
    image: postgres:16-alpine
    container_name: ai-agent-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: metrics_db
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./init-db:/docker-entrypoint-initdb.d:ro
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d metrics_db"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  prometheus:
    image: prom/prometheus:v2.50.0
    container_name: ai-agent-prometheus
    restart: unless-stopped
    ports:
      - "127.0.0.1:9090:9090"
    volumes:
      - ./deploy/prometheus:/etc/prometheus:ro
      - prometheus_data:/prometheus
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
      - '--storage.tsdb.retention.time=15d'
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  grafana:
    image: grafana/grafana:10.3.0
    container_name: ai-agent-grafana
    restart: unless-stopped
    ports:
      - "127.0.0.1:3000:3000"
    volumes:
      - ./deploy/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./deploy/grafana/dashboards:/var/lib/grafana/dashboards:ro
      - grafana_data:/var/lib/grafana
    environment:
      - GF_SECURITY_ADMIN_PASSWORD=admin
      - GF_USERS_ALLOW_SIGN_UP=false
    depends_on:
      - prometheus
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

volumes:
  qdrant_data:
    driver: local
  hf_cache:
    driver: local
  postgres_data:
    driver: local
  prometheus_data:
    driver: local
  grafana_data:
    driver: local
